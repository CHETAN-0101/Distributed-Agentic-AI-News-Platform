version: "3.9"

# =============================================================================
# AgentOS — Docker Compose
# Infrastructure services + all microservices + agents
# =============================================================================

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://agentos:agentos_dev_password@postgres:5432/agentos
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://agentos:agentos_dev_password@rabbitmq:5672/
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-latest}
  MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mistral}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mistral-embed}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  JWT_ALGORITHM: HS256
  TENANT_DEFAULT: ${TENANT_DEFAULT:-default}

x-service-base: &service-base
  restart: unless-stopped
  networks:
    - agentos-net
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  jaeger-data:

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  agentos-net:
    driver: bridge

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE
  # ---------------------------------------------------------------------------

  postgres:
    image: pgvector/pgvector:pg16
    <<: *service-base
    environment:
      POSTGRES_DB: agentos
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    <<: *service-base
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    <<: *service-base
    environment:
      RABBITMQ_DEFAULT_USER: agentos
      RABBITMQ_DEFAULT_PASS: agentos_dev_password
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"     # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  jaeger:
    image: jaegertracing/all-in-one:1.57
    <<: *service-base
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    ports:
      - "16686:16686"     # Jaeger UI
      - "4317:4317"       # OTLP gRPC
      - "4318:4318"       # OTLP HTTP
      - "6831:6831/udp"   # Jaeger agent
    volumes:
      - jaeger-data:/badger
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.52.0
    <<: *service-base
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.2
    <<: *service-base
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: agentos_admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-overview.json
    ports:
      - "3001:3000"       # 3001 to avoid conflict with Next.js on 3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # CORE PLATFORM SERVICES
  # ---------------------------------------------------------------------------

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: ../../infrastructure/docker/Dockerfile.service
    <<: *service-base
    environment:
      <<: *common-env
      SERVICE_NAME: api-gateway
      SERVICE_PORT: "8000"
      AGENT_REGISTRY_URL: http://agent-registry:8001
      ORCHESTRATOR_URL: http://orchestrator:8002
      WORKFLOW_SERVICE_URL: http://workflow-service:8003
      MEMORY_SERVICE_URL: http://memory-service:8004
      APPROVAL_SERVICE_URL: http://approval-service:8008
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  agent-registry:
    build:
      context: ./services/agent-registry
      dockerfile: ../../infrastructure/docker/Dockerfile.service
    <<: *service-base
    environment:
      <<: *common-env
      SERVICE_NAME: agent-registry
      SERVICE_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: ../../infrastructure/docker/Dockerfile.service
    <<: *service-base
    environment:
      <<: *common-env
      SERVICE_NAME: orchestrator
      SERVICE_PORT: "8002"
      AGENT_REGISTRY_URL: http://agent-registry:8001
      WORKFLOW_SERVICE_URL: http://workflow-service:8003
      POLICY_SERVICE_URL: http://policy-service:8007
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      agent-registry:
        condition: service_healthy

  workflow-service:
