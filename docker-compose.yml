      context: ./services/workflow-service
      dockerfile: ../../infrastructure/docker/Dockerfile.service
    <<: *service-base
    environment:
      <<: *common-env
      SERVICE_NAME: workflow-service
      SERVICE_PORT: "8003"
    ports:
      - "8003:8003"
    depends_on:
