        condition: service_healthy

  # ---------------------------------------------------------------------------
  # AGENTS
  # ---------------------------------------------------------------------------

  research-agent:
    build:
      context: ./agents/research-agent
      dockerfile: ../../infrastructure/docker/Dockerfile.agent
    <<: *service-base
    environment:
      <<: *common-env
      AGENT_ID: research-agent
      AGENT_PORT: "9001"
      AGENT_REGISTRY_URL: http://agent-registry:8001
